[package]
name = "libflankr_proto"
version = "0.5.17"
edition = "2024"
description = "Wire types for flankr's protocols: flankr.harness, flankr.companion and flankr link"
license = "Apache-2.0"

[features]
# The encrypted link layer (docs/design/20261022_02_LINK_AND_COMPANION_PLAN.md),
# since 0.5.17 wrappers over libhardline's tokio adapter, fixed to flankr's
# profile (docs/design/20261119_02_LIBHARDLINE_EXTRACTION_PLAN.md, step 7).
link = ["libhardline/tokio", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The link and the JSON-RPC envelope (`jsonrpc`, re-exported by `envelope`,
# which every feature combination has); `link` adds the tokio adapter.
libhardline = { git = "https://github.com/tmzt/libhardline", rev = "cf596d5ff850744c4c630a4d4a0b4e8f840b3b5f", default-features = false, features = ["jsonrpc"] }
tokio = { version = "1", default-features = false, features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
# The link tests check the wire by hand: a raw Noise peer, base58 and
# BLAKE2s-256 checksums, and the BIP-39 list.
snow = "0.10"
bs58 = "0.5"
blake2 = "0.10"
bip39 = { version = "3", default-features = false }
[[example]]
name = "link_client"
required-features = ["link"]
