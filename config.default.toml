# Default configuration for flankr
# Copy to ~/.config/flankr/config.toml to customize

# Master switch for arbitrary commands. Uncomment to force the setting on or
# off for every agent below; leave it out to honour each agent's own value.
# The --allow-arbitrary-commands / --no-arbitrary-commands CLI flags override both.
# allow_arbitrary_commands = false

[[transports]]
name = "local"
# Transport mode: "local" (direct Unix domain socket) or "remote" (SSH bridge)
mode = "local"
# Optional socket path for local mode (default: ~/.config/herdr/herdr.sock)
# socket = "~/.config/herdr/herdr.sock"
default = true

[[transports]]
name = "mini"
mode = "remote"
# Remote SSH connection string (e.g. "user@host")
remote = "tmeade@timothys-mac-mini-1"

[[agents]]
name = "claude"
allowed_commands = ["continue", "/compact"]
require_confirmation = true
# Allow free-form spoken instructions that are not on the allow list above.
# These are typed verbatim into the agent's prompt, so they are restricted to
# ASCII letters, digits, spaces and the punctuation . , ' ? : ; no '/' (slash
# commands, paths), no '-' (CLI flags), no control characters, 256 chars max.
allow_arbitrary_commands = false
# The key that stops this agent's work when a companion turn is interrupted
# or `agents.interrupt` is called, in herdr's key names. Sent as a keystroke,
# never typed. Default "esc"; "" turns interrupting off.
# interrupt_key = "esc"
# Typing into this agent's pane from the companion's terminal view, once the
# owner arms it there with a first key. Needs [terminal] input on (the
# default) and a paired device that may approve. terminal_input defaults to
# true; false makes this agent's terminal read-only. terminal_signals also
# lets ctrl+c, ctrl+d, ctrl+z and ctrl+\ through; it defaults to false.
# terminal_input = true
# terminal_signals = false

[[agents]]
name = "omp"
allowed_commands = ["continue"]
require_confirmation = true
allow_arbitrary_commands = false

[[agents]]
name = "agy"
allowed_commands = ["continue"]
require_confirmation = true
allow_arbitrary_commands = false

# A pane that runs no known agent (a shell, htop, a build): the companion
# lists it and opens it only in its terminal view, where it takes typing,
# signal keys included, once the owner arms it on the phone ([terminal]
# input on, the default). terminal_input = false here makes every such
# pane read-only. It takes no commands, messages or interrupt key; the
# global allow_arbitrary_commands never turns arbitrary commands on for it.
# Any pane opens in the terminal view with or without an entry here, an
# agent with no [[agents]] entry too.
[[agents]]
name = "shell"
allowed_commands = []
require_confirmation = true
allow_arbitrary_commands = false
allow_messages = false
interrupt_key = ""

# Every LLM flankr uses itself: the general agent's turns, card summaries
# and spoken summaries; never the coding agents in the panes. Off unless
# `enabled = true`: without it, nothing calls any model. Turned on, the rest
# is automatic: a `gemini` backend is found from a key stored with
# `flankr key set gemini` (the macOS Keychain, else
# ~/.config/flankr/secrets/gemini_api_key, mode 0600) or GEMINI_API_KEY in
# a foreground run; `flankr key status` says which. Every use is on, and each use's model is chosen by tier and age from the models the
# key can use, listed once when the daemon starts: "flash:newest" for the
# general agent, "flash-lite:oldest" (the cheapest) for summaries. A
# `model` is such a rule ("flash-lite", "flash" or "pro", then ":newest" or
# ":oldest") or an exact name ("gemini-2.5-flash"). A Pro model runs only
# where a `model` names it or a "pro:" rule. The daemon logs each use's
# choice and the model it resolved to at start; the list is not fetched
# again while it runs. The daemon reads this section again when the file or a
# key file changes (every 5 s if it can't watch files), and tells the
# companion app what is available.
# [llm]
# enabled = true
# default = "gemini"             # the backend a use takes when it names none
#
# Named backends, when the defaults aren't wanted. `kind` picks the client
# (only "gemini" for now); two backends of one kind may differ in key or
# model. A backend's `model` is its model for every use.
# [llm.backends.gemini]
# kind = "gemini"
# api_key_file = "gemini_key"     # looked in first: absolute, or next to this file
# model = "flash:newest"
#
# Uses, each optional: general_agent, card_summaries, spoken_summaries,
# policy. Each is on unless `enabled = false`; `backend` and `model`
# override.
# [llm.uses.general_agent]
# backend = "gemini"
# model = "gemini-2.5-flash"
#
# [llm.uses.spoken_summaries]
# enabled = false
#
# The plan policy plugin's judgement of a Finished card (below); like the
# summaries, "flash-lite:oldest" unless `model` says otherwise.
# [llm.uses.policy]
# enabled = false
#
# Planning: the general agent's own turns, on its backend and model, may
# read the current project's files and its agent instructions. Off unless
# `enabled = true`, and only while general_agent is on. `read` lists the
# files `list_files` and `read_file` may read, as `/`-separated patterns
# against the project's root: `*` is any part of one name, `**` alone is
# any number of folders, so "*.md" is the top folder only. Without `read`
# the file tools are off. `agents_prompt` adds the project's AGENTS.md
# (or CLAUDE.md, or GEMINI.md) to each turn.
# [llm.uses.planning]
# enabled = true
# agents_prompt = true
# read = ["*.md", "docs/**/*.md"]

# Deprecated: [gemini] is read as [llm] enabled = true with
# [llm.backends.gemini] (its `api_key_file` and `model`), until [llm] enabled is
# set; [llm.uses.*] or [llm.backends.*] tables alone do not count.
# [gemini]
# api_key_file = "gemini_key"
# model = "gemini-3.8-flash"

# How agents are named aloud and on screen. Uncomment to change the defaults.
# [naming]
# Where an agent's project name comes from: "directory" (its cwd's last
# part, the default) or "workspace" (herdr's workspace label, or the cwd's
# last part when agents share a label).
# project_from = "directory"
#
# Words of at most this many letters with none of `vowels` are spelled out
# letter by letter ("hr" -> "aitch ar"). 0 turns spelling off.
# spell_max_len = 6
# vowels = "aeiouy"
#
# [naming.letters]
# Any letter's spoken name; unlisted letters keep the default English names.
# w = "dub"
#
# [naming.aliases]
# A tab label as written, a project, or an agent name (any case) -> what to
# say and show instead. Alias values are never spelled out.
# "ctrls" = "controls"
# "17-fl" = "flankr"
# "agy" = "antigravity"

# The encrypted link for paired devices (`flankr pair`). It listens on
# 127.0.0.1:7347 unless `listen` (or `--bind <addr:port>`, repeatable, for
# one run) says otherwise; `listen = []` turns the link off.
#
# `vpn = "tailscale"` (the default): when Tailscale is running, the daemon
# makes Tailscale forward this machine's tailnet port 7347 to the link, by
# running `tailscale serve --bg --tcp 7347 tcp://127.0.0.1:7347` itself if
# the forward is missing (it stays after the daemon stops), and pairing
# offers name the tailnet address first. It changes nothing else in
# Tailscale. The forward goes to the first 127.0.0.1 address in `listen`.
#
# `vpn = "none"` (or `--vpn none`): nothing is run or read for a VPN. Bind an
# address other machines can reach, e.g. `listen = ["0.0.0.0:7347"]`; offers
# then name this machine (`<name>.local` on macOS) and its addresses. With
# only 127.0.0.1, `flankr pair` shows no QR code: a phone could not connect.
# [link]
# vpn = "tailscale"
# listen = ["127.0.0.1:7347"]
# key = "~/.config/flankr/link_key"      # the server's private key, mode 0600
# auth = "~/.config/flankr/auth.toml"    # the paired clients
# revoke_check_secs = 60                 # open connections are checked when
#                                        # auth.toml changes, and this often

# The companion's terminal view of any pane. `input` (on unless set) lets a
# paired device that may approve type into a pane, after its first key arms
# it in the app, unless that pane's agent has `terminal_input = false`; the
# arm lasts until the terminal closes. `input = false` makes every terminal
# read-only. Only for a herdr reached over its local socket, not a remote
# (SSH) one.
#
# `attach = true` (the default, for testing) keeps the daemon attached to the
# local herdr as one of herdr's own clients: an open terminal shows herdr's
# own cells, the cursor and the pane at the phone's size, and takes mouse
# input. While a phone's terminal is open, herdr's tab is sized to the phone
# and herdr's focus moves to the session's pane; a change made on the
# desktop is not forced back until the phone's terminal is touched again.
# With no terminal open the attachment claims nothing. `attach = false`
# reads terminals with herdr's `pane.read` poll only.
# [terminal]
# input = true
# attach = true

# Links from `docs/…` paths in the companion's agent view to their pages on
# repowiki (`~/src/repowiki`). Each agent's site is its directory's parent
# and own name joined with `--` (`~/src/flankr` is `src--flankr`); a path
# links to `<repowiki_url>/#/<site>/<path without .md>`. Without it no
# path is linked (web links always are).
# [urls]
# repowiki_url = "http://localhost:8088"

# Deprecated: [summary] cards = false is read as
# [llm.uses.card_summaries] enabled = false, unless [llm] is set. With card
# summaries on, every new Finished card is summarised once: a few points
# and the text to read aloud go on the card.
# [summary]
# cards = true

# Built-in plugins, each off until its table says `enabled = true`; the
# phone's Settings → Plugins writes that key here. A plugin reads only
# where [llm.uses.planning] `read` and its own patterns both match, and
# `commands` can only narrow (or, `false`, switch off) the commands it
# declares.
# An enabled plugin also offers the general agent its read-only tools,
# named `<short name>_<tool>` (e.g. `planning_plans_list`), through the
# same reads and commands. `agent_tools = false` offers none; `"all"` also
# offers the tools that change something, each run only after you approve
# it out loud.
# The planning plugin lists this project's plans and their amendments,
# from docs/design. Read-only; its tools are planning_plans_list and
# planning_plan_show.
# [plugins."dev.flankr.plugins.planning"]
# enabled = true
# commands = false
# agent_tools = true
#
# The plan policy plugin reads each Finished card's summary for a plan you
# chose Build on and, while that task's autocontinue is on, answers the
# coding agent's own "continue with step N?" question with
# `continue_command`, through the agent's allowed_commands and a
# confirmation on the phone every time. Its judgement uses
# [llm.uses.policy]. It offers the general agent no tools.
# [plugins."dev.flankr.plugins.policy"]
# enabled = false            # off: nothing is read, decided or sent
# agents = []                # [[agents]] names it may drive; empty = none
# continue_command = "continue"   # must be on each agent's allowed_commands
# max_continues = 3          # per task, then it asks instead
# confirm = "always"         # every continue is a confirmation on the phone
# quiet_secs = 15            # a card is judged only after this long with
#                            # no newer card from the same pane
# agent_tools = false
